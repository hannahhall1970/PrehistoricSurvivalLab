; Game localization target. Keys verified against UE 5.8 engine source:
;  Developer/Localization/Private/LocalizationConfigurationScript.cpp (step names/order, common keys),
;  Editor/UnrealEd/Private/Commandlets/{GatherTextFromSource,GatherTextFromAssets,GenerateGatherManifest,GenerateGatherArchive,
;  GenerateTextLocalizationResource,InternationalizationExport}Commandlet.cpp (per-step keys).
; Run: UnrealEditor-Cmd <uproject> -run=GatherText -config=Config/Localization/Game.ini
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
ResourceName=Game.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=vi

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/PrehistoricSurvivalLab
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
ShouldGatherFromEditorOnlyData=false

;Gather text from assets
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false

;Write Manifest
[GatherTextStep2]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep3]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true
LocalizedTextCollapseMode=IdenticalTextIdAndSource
POFormat=Unreal

;Write Localized Text Resource
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
LocalizedTextCollapseMode=IdenticalTextIdAndSource
POFormat=Unreal
