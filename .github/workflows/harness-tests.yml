name: harness-tests

on:
  push:
    branches: [main]
    paths: ["harness/**", ".github/workflows/harness-tests.yml"]
  pull_request:
    paths: ["harness/**", ".github/workflows/harness-tests.yml"]

permissions:
  contents: read

concurrency:
  group: harness-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Unit tests only: no UE, no Paseo daemon (live test is skipped without HARNESS_LIVE).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p .
      - run: bun test
