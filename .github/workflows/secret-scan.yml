name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Runs the checked-out (possibly PR-authored) test script; kept off the scan job's runner.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Scanner regression tests
        run: bash scripts/check_secrets.test.sh

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan added lines of every pushed or PR commit
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          GIT_NO_REPLACE_OBJECTS: "1"
        run: |
          set -euo pipefail
          scanner=scripts/check_secrets.sh
          if [ "$EVENT" = pull_request ]; then
            # Commits on the PR branch since its merge base with the target branch.
            RANGE="$PR_BASE...$PR_HEAD"
            # Use the target branch's scanner so a PR cannot disable its own scan.
            scanner="$RUNNER_TEMP/check_secrets.sh"
            git show "$PR_BASE:scripts/check_secrets.sh" >"$scanner"
          else
            # First push / new branch: before is 40 zeros, so the script scans all of after's history.
            # A before commit that is missing from the clone fails the scan instead of widening silently.
            RANGE="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          bash "$scanner" --range "$RANGE"
